name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
env:
  ACTIONS_STEP_DEBUG: true
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # タグ情報を取得するために必要

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ghost-mod/versions/*/build/libs/*.jar
            !ghost-mod/versions/*/build/libs/*-sources.jar
            ghost-server/build/libs/GhostModServer-*.jar
            !ghost-fake_client/build/libs/GhostFakeClient-*.jar
