name: Auto Release

on:
  push:
    tags:
      - 'mod/v*'
      - 'server/v*'
      - 'client/v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine component and version
        id: component
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # コンポーネントとバージョンを抽出
          if [[ "$TAG" =~ ^mod/v(.+)$ ]]; then
            COMPONENT="mod"
            VERSION="${BASH_REMATCH[1]}"
            RELEASE_NAME="[Mod] v${VERSION}"
          elif [[ "$TAG" =~ ^server/v(.+)$ ]]; then
            COMPONENT="server"
            VERSION="${BASH_REMATCH[1]}"
            RELEASE_NAME="[Server] v${VERSION}"
          elif [[ "$TAG" =~ ^client/v(.+)$ ]]; then
            COMPONENT="client"
            VERSION="${BASH_REMATCH[1]}"
            RELEASE_NAME="[FakeClient] v${VERSION}"
          else
            echo "Unknown tag format: $TAG"
            exit 1
          fi
          
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          
          # プレリリースチェック
          if [[ "$VERSION" =~ -alpha|-beta|-rc ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected prerelease: $RELEASE_NAME"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable release: $RELEASE_NAME"
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.component.outputs.release_name }}
          tag_name: ${{ steps.component.outputs.tag }}
          draft: false
          prerelease: ${{ steps.component.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.component.outputs.component == 'mod' && 'ghost-mod/versions/*/build/libs/ghostmod-*.jar' || '' }}
            ${{ steps.component.outputs.component == 'mod' && '!ghost-mod/versions/*/build/libs/ghostmod-*-sources.jar' || '' }}
            ${{ steps.component.outputs.component == 'server' && 'ghost-server/build/libs/GhostModServer-*.jar' || '' }}
            ${{ steps.component.outputs.component == 'client' && 'ghost-fake_client/build/libs/GhostFakeClient-*.jar' || '' }}

      # Modの場合はModrinthとCurseForgeに公開
      - name: Publish Mod to Modrinth and CurseForge
        if: steps.component.outputs.component == 'mod'
        working-directory: ghost-mod
        run: ../gradlew publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
