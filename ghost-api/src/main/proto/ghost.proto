syntax = "proto3";

// すべての生成クラスを com.ghost.api.proto パッケージに配置
option java_package = "com.ghost.api.proto";
// 個別クラスとして生成（GhostProto という外部クラスにまとめない）
option java_multiple_files = true;
// 生成クラスを格納する外部クラス名（java_multiple_files=true なので実質未使用）
option java_outer_classname = "GhostProto";

// --- Vec3Dto に対応 ---
// プレイヤーの3D座標（double 精度）
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// --- Vec2Dto に対応 ---
// プレイヤーのヨー・ピッチ（float 精度）
message Vec2 {
  float x = 1;
  float y = 2;
}

// --- CustomModelDataDto に対応 ---
// カスタムモデルデータ（1.21.2以降は複合型）
message CustomModelData {
  repeated float floats = 1;
  repeated bool flags = 2;
  repeated string strings = 3;
  repeated int32 colors = 4;
  int32 model = 5;
}

// --- TrimDto に対応 ---
// アーマートリムデータ
message Trim {
  string material = 1;
  string pattern = 2;
}

// --- ItemDto に対応 ---
// アイテムのビジュアル情報
message Item {
  string id = 1;
  int32 damage = 2;
  bool has_glint = 3;
  // -1 は「色なし」を意味する（sint32 で負数も効率的にエンコード）
  sint32 color = 4;
  string item_model = 5;
  // optional: null の場合はフィールドが省略される
  optional CustomModelData custom_model_data = 6;
  optional Trim trim = 7;
}

// --- EquipmentDto に対応 ---
// プレイヤーの装備セット（6スロット）
message Equipment {
  Item main_hand = 1;
  Item off_hand = 2;
  Item head = 3;
  Item chest = 4;
  Item legs = 5;
  Item feet = 6;
}

// --- PlayerData に対応 ---
// プレイヤーの全状態（毎フレーム送信される主要データ）
message PlayerDataProto {
  Vec3 pos = 1;
  Vec2 rot = 2;
  string uuid = 3;
  string name = 4;
  string pose = 5;
  string dimension = 6;
  // skinParts は byte だが protobuf は int32 で表現
  int32 skin_parts = 7;
  string main_arm = 8;
  int32 swing_time = 9;
  Equipment equipment = 10;
  bool is_using_item = 11;
  string active_hand = 12;
}

// --- 認証系メッセージ（CHAP + プロトコルバージョン検証） ---
// サーバーからクライアントへ送信するチャレンジ
message AuthChallenge {
  string nonce = 1;
  uint32 protocol_version = 2;
}

// クライアントからサーバーへ返送する HMAC-SHA256 レスポンス
message AuthResponse {
  string hash = 1;
  uint32 protocol_version = 2;
}

// サーバーからクライアントへ送信する認証成功通知
message AuthSuccess {}

// --- 全パケットの統合ラッパー ---
// 認証パケットを含めすべての通信を Protobuf バイナリ一本に統一し、
// 1 回の parseFrom で種別判定とペイロード復元を完了する
message GhostPacketProto {
  oneof payload {
    PlayerDataProto update = 1;
    string leave_uuid = 2;
    string despawn_uuid = 3;
    AuthChallenge auth_challenge = 4;
    AuthResponse auth_response = 5;
    AuthSuccess auth_success = 6;
  }
}
